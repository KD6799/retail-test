                reader.readAsText(file);

            const calculateEstimatedCost = () => {
                if (!selectedCity || brands.length === 0) return;

                const cityData = INDIAN_CITIES[selectedCity];
                const bounds = cityData.bounds;
                
                // Calculate grid points
                const gridSpacing = SCRAPE_GRID_SPACING_KM;
                const latDegPerKm = 1 / 110.574;
                const lngDegPerKm = 1 / (111.320 * Math.cos(cityData.center[0] * Math.PI / 180));
                
                const latStep = gridSpacing * latDegPerKm;
                const lngStep = gridSpacing * lngDegPerKm;
                
                // Keep this loop identical to the backend grid generator.
                let totalGridPoints = 0;
                for (let lat = bounds.min_lat; lat <= bounds.max_lat; lat += latStep) {
                    for (let lng = bounds.min_lng; lng <= bounds.max_lng; lng += lngStep) {
                        totalGridPoints++;
                    }
                }
                
                // Estimate API calls
                const minCalls = brands.length * totalGridPoints;
                const maxCalls = minCalls * MAX_CALLS_PER_GRID_POINT;

                setEstimateDetails({
                    gridPoints: totalGridPoints,
                    minCalls,
                    maxCalls,
                    minCost: minCalls * APPROX_REQUEST_COST_INR,
                    maxCost: maxCalls * APPROX_REQUEST_COST_INR
                });
            };

                    const startedAt = new Date(sessionStart).getTime();
                    const seconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));

            const generateGrid = (bounds, spacingKm, centerLat) => {
                const latDegPerKm = 1 / 110.574;
                const lngDegPerKm = 1 / (111.320 * Math.cos(centerLat * Math.PI / 180));
                
                const latStep = spacingKm * latDegPerKm;
                const lngStep = spacingKm * lngDegPerKm;
                
                const grid = [];
                let lat = bounds.min_lat;
                while (lat <= bounds.max_lat) {
                    let lng = bounds.min_lng;
                    while (lng <= bounds.max_lng) {
                        grid.push({ lat, lng });
                        lng += lngStep;
                    }
                    lat += latStep;
                }
                return grid;
            };

            const fetchPlaces = async (lat, lng, keyword, radius = 5000) => {
                const places = [];

                let apiCalls = 0;

                do {
                    const params = new URLSearchParams({
                        key: apiKey,
                        location: `${lat},${lng}`,
                        radius: radius,
                        keyword: keyword
                    });

                    if (nextPageToken) {
                        params.append('pagetoken', nextPageToken);
                    }

                    const url = `https://maps.googleapis.com/maps/api/place/nearbysearch/json?${params}`;
                    
                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        apiCalls++;

                        if (data.status === 'OK' || data.status === 'ZERO_RESULTS') {
                            places.push(...(data.results || []));
                            nextPageToken = data.next_page_token || null;
                            
                            if (nextPageToken) {
                                await new Promise(resolve => setTimeout(resolve, 2000));
                            }
                        } else if (data.status === 'OVER_QUERY_LIMIT') {
                            throw new Error('API quota exceeded. Stopping scrape.');
                        } else {
                            nextPageToken = null;
                        }
                    } catch (error) {
                        console.error('Error fetching places:', error);
                        throw error;

                } while (nextPageToken);

                return { places, apiCalls };
